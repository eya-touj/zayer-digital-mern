worker_processes 1;
pid /tmp/nginx.pid;

events {
  worker_connections 512;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 30;
  server_tokens off;

  client_max_body_size 9m;
  client_body_timeout 15s;
  client_header_timeout 15s;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' blob: https://ucarecdn.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://ucarecdn.com; font-src 'self' https://fonts.gstatic.com https://ucarecdn.com; img-src 'self' data: https:; media-src 'self' blob: https://ucarecdn.com; connect-src 'self' https://upload.uploadcare.com https://ucarecdn.com; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com https://maps.google.com https://www.google.com; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    location ^~ /devis-api/ {
      proxy_pass https://zayer-devis-platform-2.onrender.com/;
      proxy_http_version 1.1;
      proxy_set_header Host $proxy_host;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_ssl_server_name on;
      proxy_ssl_name $proxy_host;
      proxy_connect_timeout 10s;
      proxy_read_timeout 60s;
    }

    location /api/ {
      proxy_pass http://backend:5000/api/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 5s;
      proxy_read_timeout 35s;
    }

    location /uploads/ {
      proxy_pass http://backend:5000/uploads/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 30s;
    }

    location = /portfolio { return 301 /portfolio/; }
    location = /portfolio/ { try_files /index.html =404; }
    location = /portfolio/index.php { try_files /index.html =404; }
    location = /admin { return 302 /admin/; }
    location = /admin/ { try_files /index.html =404; }
    location = /admin/index.html { try_files /index.html =404; }

    location ^~ /portfolio/sites/ {
      alias /usr/share/nginx/html/portfolio/sites/;
      index index.html;
      try_files $uri $uri/ $uri/index.html =404;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
